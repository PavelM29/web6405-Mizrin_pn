<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Картинки</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">Три творения</h1>
        <p class="header__subtitle">Галерея игр</p>
    </header>

    <nav class="nav">
        <a href="main.html"  class="nav__link">Главная</a>
        <a href="dop.html"   class="nav__link nav__link--active">Картинки</a>
        <a href="table.html" class="nav__link">Сравнение</a>
        <a href="form.html"  class="nav__link">Регистрация</a>
    </nav>

    <main class="content">
        <h2 class="content__title">Представляю вашему вниманию три творения</h2>

        <div class="gallery">
            <figure class="card gallery__item">
                <img src="img/image1.jpg" alt="CS2" class="card__image">
                <figcaption class="card__caption">
                    Это <span class="highlight">Counter-Strike 2</span> — наверное самый популярный шутер.
                </figcaption>
            </figure>

            <figure class="card gallery__item">
                <img src="img/image2.jpg" alt="Dota 2" class="card__image">
                <figcaption class="card__caption">
                    Это <span class="highlight">Dota 2</span> — одна из самых популярных MOBA.
                </figcaption>
            </figure>

            <figure class="card gallery__item">
                <img src="img/image3.jpg" alt="LoL" class="card__image">
                <figcaption class="card__caption">
                    Это <span class="highlight">LoL</span> — мультяшный аналог Доты.
                </figcaption>
            </figure>
        </div>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; Здесь снова могла быть ваша реклама.</p>
    </footer>
